version: '3.8'

services:

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: courier-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode - no Zookeeper needed
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Two listeners:
      # PLAINTEXT → for other Docker containers (kafka:29092)
      # CONTROLLER → for internal KRaft consensus on port 9093
      # PLAINTEXT_HOST → for your local machine (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Same as before
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168

      # KRaft requires a pre-generated cluster ID
      # Generate your own with: docker run --rm confluentinc/cp-kafka:7.6.0 kafka-storage random-uuid
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: courier-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    container_name: courier-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: courier
      POSTGRES_USER: courier_user
      POSTGRES_PASSWORD: courier_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U courier_user -d courier" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: courier-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:8025" ]
      interval: 10s
      timeout: 5s
      retries: 5

  courier-api:
    build:
      context: ./courier-api
      dockerfile: Dockerfile
    container_name: courier-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courier
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      COURIER_CLIENT_KEY: ${COURIER_CLIENT_KEY:-dev-client-key-change-me}
      COURIER_ADMIN_KEY: ${COURIER_ADMIN_KEY:-dev-admin-key-change-me}
      # Per-client, per-channel requests allowed per minute. Production default
      # is 1000. Raise it for load tests, e.g.
      #   COURIER_RATE_LIMIT_MAX_REQUESTS=10000000 docker-compose up -d courier-api
      COURIER_RATE_LIMIT_MAX_REQUESTS: ${COURIER_RATE_LIMIT_MAX_REQUESTS:-1000}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10

  courier-worker:
    build:
      context: ./courier-worker
      dockerfile: Dockerfile
    # container_name is omitted deliberately: it conflicts with
    # deploy.replicas. Docker names replicas courier-worker-1, -2, -3.
    ports:
      - "8081-8083:8081"
    deploy:
      replicas: 1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courier
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      # Consumer threads PER INSTANCE. Total active consumers =
      # replicas x concurrency, capped at the partition count (3).
      # 1 replica x 3 = all 3 partitions consumed in parallel.
      # Scaling to 3 replicas means setting this to 1.
      COURIER_KAFKA_CONSUMER_CONCURRENCY: 3
    depends_on:
      courier-api:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:8081/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10

  courier-dashboard:
    build:
      context: ./courier-dashboard
      dockerfile: Dockerfile
    container_name: courier-dashboard
    ports:
      - "8084:8082"   # host 8084 -> container 8082 (server.port)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courier
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      COURIER_CLIENT_KEY: ${COURIER_CLIENT_KEY:-dev-client-key-change-me}
      COURIER_ADMIN_KEY: ${COURIER_ADMIN_KEY:-dev-admin-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:8082/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: