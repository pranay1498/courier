spring:
  application:
    name: courier-dashboard

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courier}
    username: ${SPRING_DATASOURCE_USERNAME:courier_user}
    password: ${SPRING_DATASOURCE_PASSWORD:courier_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  mvc:
    # Enables Pageable resolution from request parameters
    pageable:
      default-page-size: 20
      max-page-size: 100

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Courier Dashboard
    description: Redis-backed status query and statistics service
    version: 1.0.0

logging:
  level:
    com.courier: DEBUG

# Add this block at the bottom of the existing yml
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true